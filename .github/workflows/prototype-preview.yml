name: Publish ambient-gradient preview
on:
  push:
    branches:
      - prototype/ambient-gradient
    paths-ignore:
      - "preview-site/**"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production version
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout prototype version
        uses: actions/checkout@v4
        with:
          ref: prototype/ambient-gradient
          path: prototype
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build production version
        working-directory: production
        run: |
          npm install
          npm run build
      - name: Keep production site intact
        run: |
          mkdir -p site
          cp -R production/dist/. site/
      - name: Build preview version
        working-directory: prototype
        run: |
          npm install
          sed -i 's/com.example.dynamic-auras-lights/com.example.dynamic-auras-lights-preview/g' src/shared.ts
          npm run build -- --outDir ../site/preview
      - name: Point preview manifest to preview URL
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'site/preview/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const base = 'https://blackcode1242.github.io/dynamic-auras-lights/preview/';
          manifest.name = 'Dynamic Auras & Lights (Preview)';
          manifest.version = '1.6.0-preview';
          manifest.icon = base + 'icon.svg';
          manifest.background_url = base + 'background.html';
          manifest.action.icon = base + 'icon.svg';
          manifest.action.popover = base + 'index.html';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2));
          NODE
      - name: Upload combined production and preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
