name: Publish ambient-gradient preview
on:
  push:
    branches:
      - prototype/ambient-gradient
    paths-ignore:
      - "preview-site/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
        with:
          ref: prototype/ambient-gradient
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Give preview its own extension identity
        run: |
          sed -i 's/com.example.dynamic-auras-lights/com.example.dynamic-auras-lights-preview/g' src/shared.ts
      - name: Build preview
        run: npm run build -- --outDir preview-site
      - name: Point manifest to preview files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'preview-site/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const base = 'https://cdn.jsdelivr.net/gh/Blackcode1242/dynamic-auras-lights@prototype/ambient-gradient/preview-site/';
          manifest.name = 'Dynamic Auras & Lights (Preview)';
          manifest.version = '1.6.0-preview';
          manifest.icon = base + 'icon.svg';
          manifest.background_url = base + 'background.html';
          manifest.action.icon = base + 'icon.svg';
          manifest.action.popover = base + 'index.html';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-site
          if git diff --cached --quiet; then
            echo "Preview is already up to date."
          else
            git commit -m "chore: publish ambient gradient preview"
            git push origin HEAD:prototype/ambient-gradient
          fi
